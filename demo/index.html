<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Workbench</title>
  <link rel="stylesheet" href="./ui/demoPage.css" /> 
</head>
<body class="show-grid"> <!-- Default to grid -->
  <!-- Toolbar -->
  <nav class="demo-toolbar">
    <div class="toolbar-brand">
      <span class="brand-name">Liquid Glass</span>
      <span class="brand-badge">Workbench</span>
    </div>
    
    <div class="toolbar-controls">
      <button type="button" id="btnTheme" class="btn-icon" aria-label="Toggle Theme">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <div class="vr"></div>
      <a href="https://github.com/J-Houghton" target="_blank" class="btn-icon" title="View on GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
      </a>
    </div>
  </nav>

  <!-- App Layout -->
  <div class="app-container">
    
    <!-- Sidebar: Library -->
    <aside class="app-sidebar">
      <div class="sidebar-section">
        <h3>Glass Presets</h3>
        <div id="presetList" class="preset-grid">
          <!-- Populated by demoStage.ts -->
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Backgrounds</h3>
        <div id="bgList" class="bg-grid">
          <!-- Populated by demoStage.ts -->
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="demo-layout">
      <section class="demo-workspace" data-demo-workspace>
        <div class="paper-sheet">
          <workbench-patterns></workbench-patterns>
        </div>
        <div class="demo-stage-layer" data-demo-stage></div>
      </section>
    </main>
  </div>

  <script type="module">
    import '../src/index.ts';
    import './ui/demoStage.ts';
    import './ui/configPane.ts'; // Still used for tweaking active element
    import './ui/workbenchPatterns.ts';

    // Theme Toggle Logic
    const btnTheme = document.getElementById('btnTheme');
    const root = document.documentElement;
    const sun = btnTheme.querySelector('.icon-sun');
    const moon = btnTheme.querySelector('.icon-moon');

    const updateThemeIcon = (isDark) => {
      if (isDark) {
        sun.style.display = 'block';
        moon.style.display = 'none';
      } else {
        sun.style.display = 'none';
        moon.style.display = 'block';
      }
    };

    btnTheme.addEventListener('click', () => {
      const isDark = root.dataset.theme === 'dark';
      root.dataset.theme = isDark ? 'light' : 'dark';
      updateThemeIcon(!isDark);
    });

    // Init Theme
    const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isSystemDark) {
      root.dataset.theme = 'dark';
      updateThemeIcon(true);
    }
  </script>
</body>
</html>
