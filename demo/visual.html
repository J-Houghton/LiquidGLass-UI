<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass visual harness</title>
  <style>
    /* Deterministic scene for screenshots: fixed size, no animation, no chrome. */
    html, body { margin: 0; background: #f4f1ea; font-family: system-ui, sans-serif; color: #1b1b1b; }
    #scene { position: relative; width: 1180px; height: 560px; overflow: hidden; }
    .backdrop { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr 1fr 1fr 1fr; gap: 0; }
    .row { display: flex; align-items: center; gap: 18px; padding: 0 24px; }
    .row.text { font-size: 22px; line-height: 1.3; }
    .row.text strong { font-weight: 800; }
    .row.text em { color: #c2410c; }
    .row.stripes { background: repeating-linear-gradient(45deg, #111 0 10px, #fff 10px 12px); }
    .row.ramp { background: linear-gradient(to right, #000, #333, #666, #999, #ccc, #fff); }
    .row.blocks { gap: 0; padding: 0; }
    .row.blocks span { flex: 1; height: 100%; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 48px; }
    .glass { position: relative; display: block; }
    .glass__label { position: absolute; top: 100%; left: 0; margin-top: 8px; font: 700 13px/1.2 system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
    .glass__debug { position: absolute; inset: 0; pointer-events: none; background-size: cover; border-radius: inherit; z-index: 10; }
  </style>
</head>
<body>
  <div id="scene">
    <div class="backdrop">
      <div class="row text">Refraction along <strong>glyph stems</strong> and <em>colored text</em>: the quick brown fox jumps over the lazy dog 0123456789</div>
      <div class="row stripes"></div>
      <div class="row ramp"></div>
      <div class="row blocks">
        <span style="background:#ef4444"></span><span style="background:#f59e0b"></span><span style="background:#10b981"></span>
        <span style="background:#3b82f6"></span><span style="background:#8b5cf6"></span><span style="background:#111"></span><span style="background:#fff"></span>
      </div>
    </div>
    <div id="stage"></div>
  </div>
  <script type="module" src="./visual.ts"></script>
</body>
</html>
